# Autopilot application configuration.
#
# Loaded at startup into an arlcore::autopilot::AutopilotConfig and passed to
# AutopilotApp::initialize(). The platform_specs / platform_capabilities blocks are
# loaded into the vehicle-control strategy, used internally for validation/planning,
# and the platform specs report is published once on startup (it never changes while
# the autopilot is running).

dds:
  domain_id: 0
  qos_file: "CYCLONE_QOS_PROFILES.xml"
  domain_qos_profile: "UMAA_QoS_Library::UMAA_Base_Profile"
  large_collections_qos_profile: "UMAA_QoS_Library::UMAA_LargeCollections_Profile"

# UMAA source identifiers (UUID strings) this app publishes under. The command
# providers must use the IDs that consumers address as the command destination.
# platform_id is this platform's UMAA identity: incoming commands whose source
# parentID equals platform_id are classified LOCAL (onboard autonomy); any other
# parentID -- including unset -- is classified REMOTE (off-board operator).
identity:
  platform_id:            "00000000-0000-0000-0000-00000000c0fe"
  vector_source_id:       "11111111-1111-1111-1111-111111111111"
  waypoint_source_id:     "22222222-2222-2222-2222-222222222222"
  specs_source_id:        "33333333-3333-3333-3333-333333333333"
  capabilities_source_id: "44444444-4444-4444-4444-444444444444"
  nav_source_id:          "55555555-5555-5555-5555-555555555555"
  constraints_source_id:  "66666666-6666-6666-6666-666666666666"
  operational_mode_control_source_id: "77777777-7777-7777-7777-777777777777"
  operational_mode_status_source_id:  "99999999-9999-9999-9999-999999999999"

# Operational-mode FSM policy (MANUAL / STANDBY / REMOTE / AUTONOMOUS).
operational_mode:
  allow_implicit_mode_transitions: true  # incoming driving commands may move STANDBY into
                                         # their class's mode and AUTONOMOUS into REMOTE
  commands_out_of_mode_are_failed: true  # true = UMAA-strict fail; false = hold at ISSUED
                                         # until the required mode is reached
  idle_revert_s: 5.0                     # implicitly-entered REMOTE/AUTONOMOUS revert to
                                         # STANDBY after this long with no active command

# Driving-resource arbitration. Higher priority wins the single driving resource.
# Priorities are per command class: safe mode HIGHEST, any remote above any local.
arbitration:
  local:                  # commands whose source parentID == identity.platform_id
    vector_priority: 100
    waypoint_priority: 10
  remote:                 # any other source parentID (off-board operator precedence)
    vector_priority: 500
    waypoint_priority: 400
  safe_priority: 1000

loop:
  control_period_ms: 50          # main loop period
  nav_staleness_timeout_ms: 2000 # hold control if newest pose is older than this

# Default tolerances applied when a command omits them.
tolerances:
  vector:
    direction_rad: 0.0873        # ~5 deg
    speed_mps: 0.25
    elevation_m: 1.0
    hard: false                  # if true, persistent violation fails the command
    failure_delay_s: 5.0         # violation duration before a hard failure
  waypoint_defaults:
    position_m: 2.5              # capture-gate half-width
    yaw_rad: 0.1745              # ~10 deg
    elevation_m: 1.0

planner:
  lead_distance_m: 50
  turn_radius_margin: 1.25       # planned radius = margin * min turning radius
  max_list_wait_cycles: 200
  max_misses_per_waypoint: 3
  elevation_counts_as_miss: true
  max_replans: 10
  sample_step_m: 2.0             # path polyline sampling resolution
  xte:                           # cross-track tracking law; defaults = legacy pure P
    kp_scale: 1.0                # P gain scale: correction = atan2(kp*xte, turn_radius)
    ki: 0.0                      # integral gain, rad per meter-second; nulls the standing
                                 # offset a lateral current/trim leaves behind. The in-repo
                                 # sim masks under-commit; field starting point 0.02-0.05.
    integrator_limit_rad: 0.35   # |integral| clamp (~20 deg of crab)
    integrator_gate_m: 5.0       # integrate only while |xte| is inside the gate
    correction_limit_rad: 1.2    # total correction clamp; raise for platforms that need a
                                 # larger commanded-vs-current heading delta to commit
    lead_time_s: 1.0             # tangent phase-lead seconds ahead of the progress pointer
  rrt:                           # fallback planner when the direct Dubins leg clips a zone
    seed: 12345                  # deterministic sampling, salted per waypoint index
    max_iterations: 2000
    time_budget_ms: 50           # runs on the control thread: keep <= loop.control_period_ms
    goal_bias: 0.10
    near_k: 8
    edge_check_step_m: 4.0       # coarse in-tree edge sampling
    final_check_step_m: 1.0      # fine recheck of the accepted path

# Static clamp settings for the autopilot's own limits. Merged with dynamic active
# constraints and platform capabilities; the most restrictive value wins. All optional.
constraints:
  max_speed_mps: 5.0
  min_speed_mps:
  max_depth_m: 30.0
  min_depth_m:

# Water-zone geometry margins.
zones:
  safety_margin_m: 5.0           # planning/steering standoff from zone boundaries
  compliance_hysteresis_m: 2.0   # clearance needed to count as recovered (anti-flap)
  elevation_margin_m: 2.0        # vertical pad when gating zones by their depth band
  ellipse_segments: 32           # vertices of the conservative ellipse polygon

# Tangent-bug style avoidance for vector mode.
vector_avoidance:
  lookahead_rho_factor: 1.5      # lookahead >= factor * turn radius
  lookahead_speed_s: 2.0         # plus this many seconds at current speed
  exit_clear_factor: 1.3         # leave boundary-follow when clear to factor * lookahead
  exit_clear_ticks: 10           # ... for this many consecutive ticks
  min_follow_s: 2.0              # minimum boundary-follow dwell (hysteresis)

# Zone-violation recovery maneuver.
recovery:
  speed_mps: 0.0                 # recovery transit speed; 0 = platform cruising speed
  complete_hold_s: 1.0           # how long COMPLIANT must hold before recovery completes

# Violation-response policy and safe mode.
safety:
  grace_period_s: 10.0           # 0 = instant safe mode on a confirmed violation
  grace_overrides:               # optional per-class overrides of grace_period_s
    zone_s:
    speed_s:
    elevation_s:
  violation_confirm_ticks: 2     # consecutive violating ticks before a violation is confirmed
  clear_hold_s: 2.0              # compliant duration before a violation clears
  exit_on_all_clear: true        # leave safe mode when violations clear
  state_report_period_ms: 1000   # ConditionalStateReport publish period
  safe_mode:
    strategy: srp                # srp | zero_speed_hold (srp falls back to zero_speed_hold
                                 # when no csv_path is configured)
    srp:
      csv_path: ""               # e.g. "srp.csv"; empty = no SRP loaded
      origin_lat_deg:            # REQUIRED with csv_path: explicit anchor of the CSV frame
      origin_lon_deg:
      accept_commands_after_srp: true
      hold_radius_m: 10.0        # hold circle around the last SRP waypoint
      reposition_speed_mps: 1.5  # speed for drift-out repositioning
      safe_elevation_m:          # depth to hold during the SRP (empty = per-waypoint)

vehicle_control:
  type: sim                      # strategy selector
  sim:                           # simulated-vehicle strategy settings
    cycle_rate_hz: 20.0          # sim integration + nav report publish rate
    initial_latitude_deg: 39.0
    initial_longitude_deg: -76.5
    initial_heading_rad: 0.0
    accel_mps2: 1.0              # surge acceleration limit
    floor_depth_m: 60.0          # sea-floor depth for depth/ASF simulation
    current_east_mps: 0.0        # uniform water current (drift); exercises planner.xte.ki
    current_north_mps: 0.0

# Physical platform specifications -> UVPlatformSpecsReportType (published once).
platform_specs:
  name: "sim-vehicle"
  length_at_waterline_m: 5.0
  beam_at_waterline_m: 1.0
  draft_m: 0.5
  forward_distance_m: 2.5
  aft_distance_m: 2.5
  port_distance_m: 0.5
  starboard_distance_m: 0.5
  top_distance_m: 0.4
  bottom_distance_m: 0.4
  displacement_metric_ton: 1.5
  weight_light_metric_ton: 1.2
  weight_loaded_metric_ton: 1.8

# Performance limits -> UVPlatformCapabilitiesReportType. These also feed the planner
# (turn radius = speed / max_turn_rate).
platform_capabilities:
  min_water_depth_m: 2.0
  surface:
    max_forward_speed_mps: 6.0
    max_reverse_speed_mps: 2.0
    cruising_speed_mps: 3.0
    max_turn_rate_rps: 0.2618    # ~15 deg/s
    min_speed_in_medium_mps: 0.5
  underwater:
    enabled: true
    max_forward_speed_mps: 4.0
    max_turn_rate_rps: 0.1745    # ~10 deg/s
    max_depth_change_rate_mps: 0.2
    cruising_speed_mps: 2.0

# Consumer-side UMAA identity used by the mission console (and any tool acting as an
# off-board operator). Outgoing commands carry source id = source_id and source
# parentID = platform_id. Keep platform_id DIFFERENT from identity.platform_id so the
# console is classified as a REMOTE operator; set it equal to identity.platform_id to
# act as a local autonomy instead. source_id is stable so console restarts keep the
# same identity ("own vs external" classification survives a restart). Note: two
# consoles sharing this file share a source_id and will classify each other's
# commands as their own.
console:
  platform_id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
  source_id:   "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
