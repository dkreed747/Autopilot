# =============================================================================
# autopilot CI
#
# Artifacts: three application images in the GitLab Container Registry --
#   ${CI_REGISTRY_IMAGE}                    the autonomy stack
#   ${CI_REGISTRY_IMAGE}/mission-console    the mission-control web console
#   ${CI_REGISTRY_IMAGE}/mission-runner     the headless mission driver
# All built from one multi-target Dockerfile (shared, Kaniko-cached build
# stage) out of the pinned umaa-cpp submodule in the umaa-cyclone-cpp dev
# image. docker-compose.yml composes them for deployment.
#
# Pipeline: build -> image -> integration
#   * build-test       full build + ctest (autopilot + SDK) in the DEV image
#   * analyze-baselines  the tracking analysis reproduces the committed recordings
#   * build-images     Kaniko, three --target runs sharing one cache repo
#   * smoke-autopilot  app image boots standalone and shuts down cleanly
#   * smoke-console    app (job) + console (service) across the per-build
#                      network: DDS via unicast peers, full REST round trips
#   * smoke-runner     runner image drives a one-waypoint mission to
#                      COMPLETED against the app image (service), and the
#                      recording carries every column the analysis needs
#
# heading_probe is deliberately not exercised here. Against the simulator it
# would check that the sim obeys the same max_turn_rate_rps it clamps itself
# with, which is close to a tautology; its value is on a real hull, where it is
# a commissioning step (see docs/tuning.md), not a pipeline gate.
#
# While the dev-container branch is unmerged, override BASE_IMAGE_TAG with a
# ref-slug or short-sha tag of the umaa-cyclone-cpp image.
#
# Cross-project auth (job-token allowlists):
#   * umaa-cyclone-cpp must allowlist this project (dev-image pulls)
#   * umaa-cpp must allowlist this project (submodule clone)
# =============================================================================

stages:
  - build
  - image
  - integration

variables:
  DEV_IMAGE: "${CI_REGISTRY}/poseidon/utility/development-containers/umaa-cyclone-cpp"
  BASE_IMAGE_TAG: "latest"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # DDS over the GitLab per-build network: no multicast, unicast SPDP.
  # 127.0.0.1 in the peer lists covers runners whose services share localhost.
  DDS_XML_LISTEN: "<General><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex></Discovery>"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

build-test:
  stage: build
  image: "${DEV_IMAGE}:${BASE_IMAGE_TAG}"
  script: |
    set -e
    cmake --preset amd64-release
    cmake --build --preset amd64-release
    mkdir -p reports
    ctest --preset amd64-release --output-junit "${CI_PROJECT_DIR}/reports/ctest-junit.xml"
  artifacts:
    when: always
    reports:
      junit: reports/ctest-junit.xml
    expire_in: 1 week

# Regression-tests the tracking analysis itself against the recordings committed under
# docs/mission-results, each of which carries an expectations.csv locking its measured values.
# A change that alters the measurement silently would otherwise be indistinguishable from a
# change that improves the control law. No DDS and no build: seconds to run.
analyze-baselines:
  stage: build
  # analyze_tracking.py is stdlib-only by design so it can run on a boat; it needs neither the
  # SDK submodules nor the multi-GB dev image to check a handful of committed CSVs.
  image: "python:3-slim"
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script: |
    set -e
    for run in . lawnmower-10m lawnmower-20m lawnmower-40m lawnmower-20m-r1 depth-spiral; do
      dir="docs/mission-results/${run}"
      echo "--- ${dir} ---"
      out="$(python3 tools/analyze_tracking.py "${dir}" --expect "${dir}/expectations.csv")"
      echo "${out}"
      # The depth-rate-limited spiral flies loop-back passes the from-start preview cannot
      # contain, so its geometric metrics must stay suppressed rather than reported as error.
      if [ "${run}" = "depth-spiral" ]; then
        echo "${out}" | grep -q "GEOMETRIC GATES REFUSED" \
          || { echo "spiral geometry was not refused"; exit 1; }
      fi
    done
    # lawnmower-20m-r1 is the only recording in the post-refactor schema, so it is the only one
    # that exercises the reported-yaw-rate, planner-curvature and meta.csv paths rather than the
    # legacy fallbacks. It must also pass the acceptance gates outright: the archived recordings
    # predate the tracking work and cannot.
    python3 tools/analyze_tracking.py docs/mission-results/lawnmower-20m-r1 --gate > /dev/null \
      || { echo "the post-refactor reference recording no longer passes the acceptance gates"; exit 1; }
    python3 tools/analyze_tracking.py docs/mission-results/lawnmower-20m-r1 \
      | grep -q "omega source: reported" \
      || { echo "the reference recording is not being read through the reported-yaw-rate path"; exit 1; }
    echo "baseline analysis OK: recordings reproduce, spiral refused, r1 passes the gates"

# Three targets from one Dockerfile; the first run compiles and populates the
# cache repo, the other two replay the build stage from cache. --cleanup
# resets kaniko's filesystem between runs in the same container.
build-images:
  stage: image
  needs: ["build-test"]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script: |
    set -e
    mkdir -p /kaniko/.docker
    AUTH="$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
    printf '{"auths":{"%s":{"auth":"%s"}}}' "${CI_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json
    for target in autopilot mission-console mission-runner; do
      rm -rf /kaniko/stages /kaniko/[0-9]* 2>/dev/null || true
      if [ "${target}" = "autopilot" ]; then DEST="${CI_REGISTRY_IMAGE}"; else DEST="${CI_REGISTRY_IMAGE}/${target}"; fi
      EXTRA=""
      for tag in ${EXTRA_TAGS}; do EXTRA="${EXTRA} --destination ${DEST}:${tag}"; done
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --target "${target}" \
        --build-arg "BASE_IMAGE=${DEV_IMAGE}:${BASE_IMAGE_TAG}" \
        --destination "${DEST}:${CI_COMMIT_SHORT_SHA}" \
        --destination "${DEST}:${CI_COMMIT_REF_SLUG}" \
        ${EXTRA} \
        --cache=true \
        --cache-repo "${CI_REGISTRY_IMAGE}/cache" \
        --cache-ttl 168h \
        --cleanup
    done
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        EXTRA_TAGS: "${CI_COMMIT_TAG} latest"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        EXTRA_TAGS: "latest"
    - if: '$CI_COMMIT_BRANCH'      # feature branches: sha + ref-slug tags only

# App image boots standalone (no console in the image any more) and exits
# cleanly on SIGTERM.
smoke-autopilot:
  stage: integration
  needs: ["build-images"]
  image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  variables:
    GIT_STRATEGY: none
    CYCLONEDDS_URI: "file:///opt/autopilot/share/umaa-cpp/config/cyclonedds-loopback.xml"
  script: |
    set -e
    cd /opt/autopilot
    bin/autopilot autopilot.yaml &
    PID=$!
    sleep 10
    kill -0 "${PID}" || { echo "autopilot died during startup"; exit 1; }
    kill -TERM "${PID}"
    wait "${PID}"
    echo "autopilot image smoke OK"

# The split-image integration gate: the console runs as a GitLab service on
# the per-build network; the job runs the autopilot from the app image and
# drives the console's REST API through the same round trips the combined
# image used to smoke (constraints incl. the stale-metadata regression,
# operational mode, vector execute/cancel).
smoke-console:
  stage: integration
  needs: ["build-images"]
  image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  services:
    - name: "${CI_REGISTRY_IMAGE}/mission-console:${CI_COMMIT_SHORT_SHA}"
      alias: mission-console
      variables:
        CYCLONEDDS_URI: "${DDS_XML_LISTEN}"
  variables:
    GIT_STRATEGY: none
    FF_NETWORK_PER_BUILD: "true"
    CONSOLE_HOST: mission-console
    CYCLONEDDS_URI: "<General><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex><Peers><Peer address=\"mission-console\"/><Peer address=\"127.0.0.1\"/></Peers></Discovery>"
  script: |
    set -e
    cd /opt/autopilot
    bin/autopilot autopilot.yaml &
    APP=$!
    http_get() {
      exec 3<>"/dev/tcp/${CONSOLE_HOST}/8080"
      printf 'GET %s HTTP/1.0\r\nHost: console\r\n\r\n' "$1" >&3
      cat <&3
      exec 3<&-
    }
    http_post() {
      body="$2"
      exec 3<>"/dev/tcp/${CONSOLE_HOST}/8080"
      printf 'POST %s HTTP/1.0\r\nHost: console\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s' \
        "$1" "${#body}" "${body}" >&3
      cat <&3
      exec 3<&-
    }
    up=""
    for i in $(seq 1 45); do
      if http_get / 2>/dev/null | grep -qi '<html'; then up=1; break; fi
      sleep 1
    done
    [ -n "${up}" ] || { echo "web UI never came up"; exit 1; }
    http_get /api/state | grep -q '"telemetry"' || { echo "/api/state missing telemetry"; exit 1; }
    # Constraint round trip across containers: console -> DDS -> autopilot -> read-back.
    resp=$(http_post /api/constraints '{"type":"speed","name":"smoke","op":"lte","value":2.5}')
    echo "${resp}" | grep -q '"id"' || { echo "constraint POST rejected"; exit 1; }
    smoke_id=$(printf '%s' "${resp}" | sed -n 's/.*"id":"\([0-9a-fA-F-]*\)".*/\1/p')
    [ -n "${smoke_id}" ] || { echo "constraint POST returned no id"; exit 1; }
    roundtrip=""
    for i in $(seq 1 20); do
      if http_get /api/state | grep -q '"name":"smoke"'; then roundtrip=1; break; fi
      sleep 1
    done
    [ -n "${roundtrip}" ] || { echo "constraint never round-tripped through the autopilot"; exit 1; }
    # Regression: add-after-edit must still round-trip (epoch-0 metadata warn-spin).
    http_post /api/constraints "{\"id\":\"${smoke_id}\",\"type\":\"speed\",\"name\":\"smoke\",\"op\":\"lte\",\"value\":3.0}" \
      | grep -q '"id"' || { echo "constraint edit rejected"; exit 1; }
    http_post /api/constraints '{"type":"speed","name":"smoke2","op":"lte","value":1.5}' \
      | grep -q '"id"' || { echo "post-edit constraint POST rejected"; exit 1; }
    addback=""
    for i in $(seq 1 20); do
      if http_get /api/state | grep -q '"name":"smoke2"'; then addback=1; break; fi
      sleep 1
    done
    [ -n "${addback}" ] || { echo "add-after-edit never round-tripped (stale-metadata regression)"; exit 1; }
    # Operational-mode round trip; then a REMOTE vector while in REMOTE.
    http_get /api/state | grep -q '"operational_mode"' || { echo "no operational_mode block"; exit 1; }
    http_post /api/mode '{"mode":"REMOTE"}' | grep -q '"session"' || { echo "mode POST rejected"; exit 1; }
    modeok=""
    for i in $(seq 1 20); do
      if http_get /api/state | grep -q '"mode":"REMOTE"'; then modeok=1; break; fi
      sleep 1
    done
    [ -n "${modeok}" ] || { echo "mode never round-tripped"; exit 1; }
    http_post /api/vector '{"heading_deg":90,"speed_mps":1.0,"timeout_s":30}' \
      | grep -q '"session"' || { echo "vector POST rejected"; exit 1; }
    vecok=""
    for i in $(seq 1 15); do
      if http_get /api/state | grep -q '"status":"EXECUTING"'; then vecok=1; break; fi
      sleep 1
    done
    [ -n "${vecok}" ] || { echo "vector command never executed"; exit 1; }
    http_post /api/vector/cancel '{}' | grep -q '"canceled":true' || { echo "vector cancel failed"; exit 1; }
    kill -TERM "${APP}"
    wait "${APP}" || true
    echo "split-image smoke OK: DDS across containers, constraint + mode + vector round-tripped"

# Runner image drives a one-waypoint mission to COMPLETED against the app
# image. mission_runner exits 0 only on COMPLETED.
smoke-runner:
  stage: integration
  needs: ["build-images"]
  timeout: 10m
  image: "${CI_REGISTRY_IMAGE}/mission-runner:${CI_COMMIT_SHORT_SHA}"
  services:
    - name: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      alias: autopilot
      variables:
        CYCLONEDDS_URI: "${DDS_XML_LISTEN}"
  variables:
    GIT_STRATEGY: none
    FF_NETWORK_PER_BUILD: "true"
    CYCLONEDDS_URI: "<General><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex><Peers><Peer address=\"autopilot\"/><Peer address=\"127.0.0.1\"/></Peers></Discovery>"
  script: |
    set -e
    cd /opt/autopilot
    printf 'east_m,north_m,speed_mps,capture_radius_m\n0,40,3.0,12\n' > /tmp/mission.csv
    bin/mission_runner autopilot.yaml /tmp/out /tmp/mission.csv
    # The runner image is UBI-minimal (no python, no awk), so assert the recording schema with
    # grep. A missing column means the tracking analysis silently loses a signal.
    head -1 /tmp/out/track.csv | grep -q 'yaw_rate_rps' \
      || { echo "track.csv is missing yaw_rate_rps"; exit 1; }
    head -1 /tmp/out/track.csv | grep -q 'cross_track_error_m' \
      || { echo "track.csv is missing the execution-status columns"; exit 1; }
    head -1 /tmp/out/planned_path.csv | grep -q 'kappa_1pm' \
      || { echo "planned_path.csv is missing curvature"; exit 1; }
    grep -q '^turn_radius_m,' /tmp/out/meta.csv \
      || { echo "meta.csv is missing turn_radius_m"; exit 1; }
    [ "$(grep -c . /tmp/out/track.csv)" -gt 100 ] || { echo "track.csv too short"; exit 1; }
    echo "runner smoke OK: mission COMPLETED across containers, recording schema intact"
